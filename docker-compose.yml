services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fostertogether
      POSTGRES_PASSWORD: fostertogether
      POSTGRES_DB: fostertogether
    ports:
      - "5432:5432"
    volumes:
      - ftmn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fostertogether -d fostertogether"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fostertogether
      SPRING_DATASOURCE_USERNAME: fostertogether
      SPRING_DATASOURCE_PASSWORD: fostertogether

volumes:
  ftmn_pgdata: